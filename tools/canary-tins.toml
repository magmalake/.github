# The tins the nightly canary builds, bottom-up. See tools/canary.py.
#
# One [[tin]] per repository, in an order where everything a tin consumes
# comes before it. The canary clones each one at `ref` into `<work>/<dir>`, so
# the checkouts are siblings and `-I ../x.mojo/src` resolves the way it does in
# each repo's own CI.
#
#   dir       directory under the work dir, default: the repository name. It
#             is the path the other repos' CI checks the tin out at
#             (morca-dev/dista is "dista.mojo": morca's -I ../dista.mojo/src).
#   repo      "org/name" on GitHub, default: "magmalake/<dir>". Another org is
#             fine (repo = "morca-dev/dista").
#   url       clone URL, default https://github.com/<repo> (another host, or
#             a local repository for a trial run).
#   ref       branch (or tag) to clone, default: the repository's default
#             branch. Only for a tin whose port to the shared pin is still an
#             open PR: name the PR in `note`, and drop `ref` once it merges
#             (a ref that no longer exists fails the tin and says so). The
#             summary's "tested at" column puts any ref but main in bold.
#   checks    what to run, in the tin's directory, each with `bash -e`. A
#             string, or { name = "...", run = "...", job = "..." }. Mirror
#             what the tin's own CI runs for tests; leave out what needs
#             secrets, a cluster, docker, or a non-Mojo toolchain the tin's
#             CI tests separately.
#   job       which workflow job runs the tin's checks, default "libraries";
#             a check's own `job` overrides it. Each job is a runner of its
#             own (`--job`, and the matrix in nightly-canary.yml, which must
#             list every job named here), so the apps and examples do not
#             lengthen the libraries' run. Every job clones and rewrites the
#             whole list; a need in another job is built from source, not
#             waited for.
#   submodules  true to fetch git submodules before the checks (only in a
#             job that runs the tin).
#   needs     tins consumed by source path (`-I ../x/src`, CI checking the
#             sibling out). Tins named in a pixi.toml git dependency outside
#             [feature.*] tables are added automatically. A tin whose need
#             failed is skipped, not run.
#   dev_only  true for tools every tin's lint or bench environment pulls in;
#             their failure does not block the tins that use them (a real
#             build break still shows up in those tins' own logs).
#   timeout   minutes per check, default 45.
#   enabled   false keeps a tin on the list without running it; say why in
#             `note`.

[[tin]]
dir = "bench.mojo"
checks = ["pixi run test", "pixi run check-cli"]
dev_only = true

[[tin]]
dir = "threads.mojo"
checks = ["pixi run test"]

[[tin]]
dir = "lint.mojo"
# `check` = unit tests + the corpus in text and --lsp mode; the corpus
# imports threads from ../threads.mojo.
checks = ["pixi run check"]
needs = ["threads.mojo"]
dev_only = true

[[tin]]
dir = "hashes.mojo"
checks = ["pixi run test"]

[[tin]]
dir = "snappy.mojo"
checks = ["pixi run test"]

[[tin]]
dir = "roaring.mojo"
checks = ["pixi run test"]

[[tin]]
dir = "thrift.mojo"
checks = ["pixi run test"]

[[tin]]
dir = "memory-region.mojo"
checks = ["pixi run test"]

[[tin]]
dir = "deflate.mojo"
checks = ["pixi run test"]

[[tin]]
dir = "sqlite.mojo"
checks = ["pixi run test", "pixi run examples"]

[[tin]]
dir = "iceberg-rs.mojo"
# The Mojo side; CI's `cargo test` of the Rust shim does not involve Mojo.
checks = ["pixi run test"]

[[tin]]
dir = "encoder.mojo"
# `test` downloads two small sentence-embedding models from Hugging Face.
checks = ["pixi run smoke-cpu", "pixi run test"]

[[tin]]
dir = "zstd.mojo"
checks = ["pixi run test"]

[[tin]]
dir = "lz4.mojo"
checks = ["pixi run test"]

[[tin]]
dir = "brotli.mojo"
checks = ["pixi run test"]

[[tin]]
dir = "objectstore.mojo"
# `check` = tests + the CLI build.
checks = ["pixi run check"]

[[tin]]
dir = "arrow-mlake.mojo"
checks = ["pixi run test"]
needs = ["memory-region.mojo"]

[[tin]]
dir = "mozz_mlake"
# CI builds the conda package and installs it; the package build is what
# json_mlake's fuzz environment consumes, the tests are the tin's own.
checks = [
    { name = "package", run = "pixi exec rattler-build build --recipe recipe.yaml --output-dir build/canary-pkg -c \"$CANARY_CHANNEL\" -c conda-forge" },
    "pixi run tests",
]

[[tin]]
dir = "json_mlake"
checks = [
    { name = "package", run = "pixi exec rattler-build build --recipe recipe.yaml --output-dir build/canary-pkg -c \"$CANARY_CHANNEL\" -c conda-forge" },
    # tests-cpu is ~35 compiles in one task; each runs on its own, so the
    # flaky compiler crash is retried per compile, not per task.
    { name = "tests-cpu", run = """
files=$(python3 -c "import tomllib; print(tomllib.load(open('pixi.toml', 'rb'))['tasks']['tests-cpu'])" | grep -oE '[^ ]+\\.mojo')
for f in $files; do pixi run "$CANARY_TOOLS/flaky-retry.sh" mojo -I . "$f"; done
""" },
]

[[tin]]
dir = "avro.mojo"
checks = ["pixi run test", "pixi run test-cursor"]
needs = ["deflate.mojo"]

[[tin]]
dir = "postgres.mojo"
# `test` = unit + a throwaway server from the conda postgresql package + pool.
checks = ["pixi run test"]

[[tin]]
dir = "process.mojo"
checks = ["pixi run test"]

[[tin]]
dir = "parquet.mojo"
# `check` = tests + CLI + lint. carrow-lib is a shared library with several
# @export functions, the shape that hit the build_field codegen bug
# (parquet.mojo#74); it is linked and then loaded, because on Linux that bug
# links fine and fails at dlopen.
checks = [
    "pixi run check",
    { name = "carrow-lib + dlopen", run = "pixi run carrow-lib && pixi run python3 \"$CANARY_TOOLS/dlopen.py\" build/libpqcarrow*" },
]
needs = [
    "arrow-mlake.mojo", "memory-region.mojo", "threads.mojo", "thrift.mojo",
    "hashes.mojo", "snappy.mojo", "deflate.mojo", "avro.mojo",
]

[[tin]]
dir = "flare_mlake"
# The commands of CI's `tests` job, each through flaky-retry.sh. flare
# compiles against threads.mojo from source.
checks = [
    { name = "tests", run = """
T="-I ../threads.mojo/src -I ../threads.mojo/compat"
R="$CANARY_TOOLS/flaky-retry.sh"
pixi run $R mojo -I . $T tests/test_dylib.mojo
pixi run $R mojo -I . $T tests/http/test_client_read_timeout.mojo
pixi run $R mojo -I . $T tests/http/test_server_ws_upgrade.mojo
pixi run $R mojo -I . $T tests/http/test_server_ws_offload.mojo
pixi run $R mojo -I . $T tests/ws/test_ws.mojo
pixi run $R mojo -I . $T tests/grpc/test_grpc.mojo
pixi run $R mojo -I . $T tests/grpc/test_metadata.mojo
pixi run $R mojo -I . $T tests/grpc/test_grpc_client.mojo
pixi run $R mojo -I . $T tests/grpc/test_grpc_server_stream.mojo
pixi run $R mojo -I . $T tests/grpc/test_grpc_compression.mojo
pixi run $R mojo -I . $T tests/http/test_http.mojo
pixi run $R mojo -I . $T tests/http2/test_h2_frame.mojo
pixi run $R mojo -I . $T tests/http2/test_h2_hpack.mojo
pixi run $R mojo -I . $T tests/tls/test_tls.mojo
pixi run $R mojo -I . $T tests/net/test_net.mojo
pixi run $R mojo -I . $T tests/net/test_fcntl_decl.mojo
pixi run $R mojo -I . $T tests/net/test_libc_abi.mojo
pixi run $R mojo -I . $T tests/crypto/test_base64.mojo
pixi run $R mojo -I . $T tests/crypto/test_hmac.mojo
""" },
]
needs = ["threads.mojo"]
timeout = 60

[[tin]]
dir = "k8s.mojo"
# CI's `unit` job; the `kind` job needs a cluster.
checks = ["pixi run unit"]

[[tin]]
dir = "iceberg.mojo"
# `check` = tests (with MinIO and a throwaway PostgreSQL) + CLI + lint.
# carrow-scan-lib at default optimization is where the build_field codegen
# bug showed up first: link failure on macOS, dlopen failure on Linux.
checks = [
    "pixi run check",
    { name = "carrow-scan-lib + dlopen", run = "pixi run carrow-scan-lib && pixi run python3 \"$CANARY_TOOLS/dlopen.py\" build/libibscan*" },
]
needs = [
    "hashes.mojo", "deflate.mojo", "avro.mojo", "thrift.mojo", "snappy.mojo",
    "parquet.mojo", "arrow-mlake.mojo", "memory-region.mojo", "roaring.mojo",
    "objectstore.mojo", "zstd.mojo", "lz4.mojo", "threads.mojo",
    "sqlite.mojo", "postgres.mojo", "brotli.mojo",
]
timeout = 60

[[tin]]
dir = "flight.mojo"
# pyarrow as the reference reader and Flight client.
checks = [
    "pixi run -e verify verify-ipc",
    "pixi run -e verify verify-flight",
    "pixi run -e verify verify-iceberg",
]
needs = [
    "flare_mlake", "threads.mojo", "iceberg.mojo", "parquet.mojo",
    "arrow-mlake.mojo", "memory-region.mojo", "avro.mojo", "deflate.mojo",
    "thrift.mojo", "zstd.mojo", "snappy.mojo", "lz4.mojo", "brotli.mojo",
    "hashes.mojo", "roaring.mojo", "objectstore.mojo",
]
timeout = 60

# ── Ported after the canary started ─────────────────────────────────────────

[[tin]]
dir = "xml.mojo"
checks = ["pixi run check"]

[[tin]]
dir = "sigv4.mojo"
checks = ["pixi run check"]

[[tin]]
dir = "maws"
# CI's `check` (tests + the CLI), the CLI smoke, and the release tarball
# unpacked and run outside pixi. Not run: install.sh against a local server
# and the py_reference pytest (no Mojo). sigv4 and xml by source path.
checks = [
    "pixi run check",
    { name = "cli smoke", run = "pixi run ./build/maws --version" },
    { name = "dist", run = """
pixi run dist
rm -rf build/canary-unpack && mkdir -p build/canary-unpack
tar -C build/canary-unpack -xzf build/dist/maws-*.tar.gz
env -i HOME="$HOME" PATH=/usr/bin:/bin build/canary-unpack/maws-*/bin/maws --version
""" },
]
needs = ["sigv4.mojo", "xml.mojo"]

[[tin]]
dir = "restate.mojo"
# CI's three steps. The Rust shim is a pixi source dependency built with the
# runner's cargo; `it` and `it-served` boot a throwaway restate-server through
# npx (Node on the runner), on the ports CI uses.
checks = [
    "pixi run build-example",
    { name = "it", run = "RESTATE_IT_INGRESS=18080 RESTATE_IT_ADMIN=19070 RESTATE_IT_NODE=15122 RESTATE_IT_ENDPOINT=19080 pixi run it" },
    { name = "it-served", run = "RESTATE_IT_INGRESS=28080 RESTATE_IT_ADMIN=29070 RESTATE_IT_NODE=25122 RESTATE_IT_ENDPOINT=29080 pixi run it-served" },
]

# ── Apps: dista, morca and the census ───────────────────────────────────────
# Their ports to the shared pin are still draft PRs, so each is tested at its
# port branch. When the PR merges, delete the `ref` line (and this sentence of
# the note): main is then the port.

[[tin]]
dir = "dista.mojo"
repo = "morca-dev/dista"
ref = "mojo-1.3-nightly"
note = "at the port branch of morca-dev/dista#144 (draft); drop `ref` when it merges"
job = "apps"
# CI's `test`, `data` and `fuzz` jobs; its `kind` job needs a cluster.
checks = [
    "pixi run test",
    { name = "data", run = "pixi run -e data test-data" },
    { name = "fuzz", run = "FUZZ_RUNS=20000 pixi run -e fuzz fuzz" },
]
# The data environment compiles the read stack from the checkouts next door.
needs = [
    "memory-region.mojo", "arrow-mlake.mojo", "parquet.mojo", "threads.mojo",
    "thrift.mojo", "hashes.mojo", "snappy.mojo", "deflate.mojo", "avro.mojo",
    "roaring.mojo", "objectstore.mojo", "zstd.mojo", "lz4.mojo", "brotli.mojo",
    "sqlite.mojo", "postgres.mojo", "iceberg.mojo",
]

[[tin]]
dir = "morca"
repo = "morca-dev/morca"
ref = "mojo-1.3-nightly"
note = "at the port branch of morca-dev/morca#550 (draft); drop `ref` when it merges"
# CI's three `test` shards and `fuzz` in one job, its three `data` groups and
# `rust-worker` in another: ~95 minutes in all with CI's caches, more cold.
# All of it starts its own PostgreSQL and MinIO from conda-forge. The Rust
# tests run cargo in the `rust` environment (scripts/cargo.sh), which holds no
# Mojo: on macOS conda-forge's rust and the nightly compiler both ship
# lib/libLLVM.dylib. The `ouromo` environment is commented out in pixi.toml
# (no ouromo is built on this compiler) and is not used here.
# Left out: kind (a cluster), the runtime and project images (docker),
# project-test and project-release (scratch projects through morca's
# reusable workflows), runtime-lock (deploy/runtime/pixi.lock against
# morca-mojo's pins, which the canary rewrites), formal (Lean, no Mojo),
# format, version and customs.
job = "morca"
checks = [
    { name = "test-executor-core", run = "MORCA_ADMIT_MEMORY_PRESSURE=0 pixi run -e default test-executor-core" },
    { name = "test-executor-workers", run = "MORCA_ADMIT_MEMORY_PRESSURE=0 pixi run -e default test-executor-workers" },
    { name = "test-scheduler-ui", run = "MORCA_ADMIT_MEMORY_PRESSURE=0 pixi run -e default test-scheduler-ui" },
    { name = "fuzz", run = "FUZZ_RUNS=20000 pixi run -e fuzz fuzz" },
    { name = "data / tables", run = "MORCA_ADMIT_MEMORY_PRESSURE=0 pixi run -e data test-data-tables", job = "morca-data" },
    { name = "data / sensors", run = "MORCA_ADMIT_MEMORY_PRESSURE=0 pixi run -e data test-data-sensors", job = "morca-data" },
    { name = "data / keyed", run = "MORCA_ADMIT_MEMORY_PRESSURE=0 pixi run -e data test-data-keyed", job = "morca-data" },
    { name = "rust-worker", run = "pixi run -e data test-rust-worker && pixi run -e data test-hindcast && pixi run -e data test-rust-sdk", job = "morca-data" },
]
# dista and k8s compile from source (DEP_INC), and the data environment the
# whole read stack.
needs = [
    "dista.mojo", "k8s.mojo", "memory-region.mojo", "arrow-mlake.mojo",
    "parquet.mojo", "threads.mojo", "thrift.mojo", "hashes.mojo", "snappy.mojo",
    "deflate.mojo", "avro.mojo", "roaring.mojo", "objectstore.mojo", "zstd.mojo",
    "lz4.mojo", "brotli.mojo", "sqlite.mojo", "postgres.mojo", "iceberg.mojo",
]
timeout = 60

[[tin]]
# The GH Archive census (the gharchive.example worktree is this repository).
dir = "census"
repo = "morca-dev/census"
ref = "mojo-1.3-nightly"
note = "at the port branch of morca-dev/census#222 (draft); drop `ref` when it merges"
job = "apps"
# CI's `test` job. Left out: the image jobs (docker, and a push to GHCR off
# main), customs, the morca.dev.toml grep (no Mojo), and test-daily (three
# hours of GH Archive off the network; not in CI either).
checks = ["pixi run build", "pixi run test", "pixi run test-register", "pixi run test-upgrade"]
timeout = 60

# ── Examples ────────────────────────────────────────────────────────────────

[[tin]]
dir = "taxibench.example"
job = "examples"
# No CI of its own. The two programs build against iceberg-mojo (a package,
# here from the iceberg.mojo checkout); running the suite needs the TLC
# downloads (`load`), and the images docker, so neither is run.
checks = ["pixi run build", "pixi run build-probe"]

[[tin]]
dir = "datafusion.example"
job = "examples"
# CI's `pixi run test`: the Mojo bridge (a shared library from the read stack's
# sources), the Rust provider, and the oracle tests against a PyIceberg table.
checks = ["pixi run test"]
needs = [
    "iceberg.mojo", "parquet.mojo", "arrow-mlake.mojo", "memory-region.mojo",
    "avro.mojo", "deflate.mojo", "thrift.mojo", "zstd.mojo", "snappy.mojo",
    "lz4.mojo", "brotli.mojo", "hashes.mojo", "roaring.mojo", "objectstore.mojo",
    "threads.mojo",
]
timeout = 60

[[tin]]
dir = "duckdb.extension"
job = "examples"
# DuckDB and its extension tools are submodules. CI's build (the bridge, then
# DuckDB and the extension, ~20 minutes cold) and its SQL tests, which make
# their fixtures with uv, installed the way CI does when it is missing. Plus
# test-mojo, the bridge's kernels on their own, which CI does not run.
submodules = true
checks = [
    { name = "build + test", run = """
export PATH="$HOME/.local/bin:$PATH"
command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
pixi run test
""" },
    "pixi run test-mojo",
]
needs = [
    "iceberg.mojo", "parquet.mojo", "arrow-mlake.mojo", "memory-region.mojo",
    "avro.mojo", "deflate.mojo", "thrift.mojo", "zstd.mojo", "snappy.mojo",
    "lz4.mojo", "brotli.mojo", "hashes.mojo", "roaring.mojo", "objectstore.mojo",
    "threads.mojo",
]
timeout = 60

[[tin]]
dir = "pyarrow-flight.example"
job = "examples"
# `check`: every client example against the repo's pyarrow reference server.
# No Mojo is compiled (the run against flight.mojo's server is a manual step
# in its README), so this watches only its Python side: pyarrow, Daft.
checks = ["pixi run check"]

[[tin]]
dir = "threads.example"
job = "examples"
checks = ["pixi run check"]
enabled = false
note = "frozen at mojo ==1.0.0 on purpose: the companion code of the Mojo 1.0 threads post"

# ── Not on the shared nightly pin yet ───────────────────────────────────────

[[tin]]
dir = "requests"
checks = ["pixi run test"]
enabled = false
note = "floats on mojo >=1.2.0 instead of the shared pin; its tests start local servers"
