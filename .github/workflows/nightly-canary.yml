# Org-wide: does every tin still build and pass on the newest Mojo nightly?
#
# Each tin pins one exact nightly (`mojo-compiler ==<version>`), all of them
# the same one. That keeps the org consistent, and it also means a compiler or
# stdlib change that breaks a tin stays invisible until somebody moves the pin,
# usually weeks later and in the middle of other work, with a dozen nightlies'
# worth of changes to bisect. This moves the pin every day in a scratch
# checkout of the whole graph, so a break is noticed the day it lands.
#
# tools/canary.py clones every tin in tools/canary-tins.toml (at main, or at
# the port branch the file names for a tin whose port is still a PR) as
# siblings, rewrites each pixi.toml (and recipe.yaml) to the target nightly,
# turns the git-pinned sibling dependencies into path dependencies on the
# sibling checkouts, and runs each tin's tests bottom-up. Nothing is pushed
# anywhere: the red run and its summary tables are the signal.
#
# One runner per job of the tins file: the libraries, the apps (dista and the
# census), morca's tests, morca's data and Rust tests, and the examples. Each
# clones and rewrites the whole graph and builds what its tins need from
# source, so none waits for another, and the apps and examples don't lengthen
# the libraries' ~45 minutes.
#
# Linux only for now; hosted macOS runners are scarce, and the tins' own
# scheduled CI covers macOS against the pinned nightly.

name: Nightly canary

on:
  schedule:
    # 07:10 UTC. The max-nightly channel publishes around 05:20 UTC; this
    # leaves time for the mirror, and stays off the hour (and off
    # dep-drift's 06:20) because every cron on the hour queues together.
    - cron: "10 7 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: mojo-compiler version to test (empty = newest nightly on max-nightly; `pin` = the version the tins pin).
        type: string
        default: ""
      only:
        description: Comma-separated tins to run (empty = all); the rest are still cloned.
        type: string
        default: ""
      job:
        description: One job to run (libraries, apps, morca, morca-data, examples; empty = all).
        type: string
        default: ""
  # A change to the canary itself runs the canary, at the tins' own pin
  # (`--version pin`), not at the newest nightly: the question a pull request
  # asks is whether the tool works, and a regression in the night's compiler
  # would make it red for a reason that has nothing to do with the change.
  pull_request:
    paths:
      - tools/canary.py
      - tools/canary-tins.toml
      - tools/dlopen.py
      - tools/flaky-retry.sh
      - .github/workflows/nightly-canary.yml

permissions:
  contents: read

concurrency:
  group: nightly-canary-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  canary:
    # Says which version, and why: a pull request tests the canary at the pin.
    name: >-
      ${{ matrix.job }} (${{ github.event_name == 'pull_request' && 'pinned version, pull request'
      || (inputs.version == 'pin' && 'pinned version'
      || (inputs.version && format('mojo {0}', inputs.version) || 'newest nightly')) }})
    runs-on: ubuntu-latest
    # The libraries take about 45 minutes on ubuntu-latest and ~15 GB of disk;
    # morca's two jobs are the longest. The timeout leaves room for a slow day.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Every job named in tools/canary-tins.toml (`canary.py --list-jobs`;
        # tests/test_canary.py checks the two agree).
        job: [libraries, apps, morca, morca-data, examples]
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.job || inputs.job == matrix.job }}

      - uses: prefix-dev/setup-pixi@v0.10.2
        if: ${{ !inputs.job || inputs.job == matrix.job }}
        with:
          # The version every tin's lock is written by.
          pixi-version: v0.78.0
          run-install: false

      - name: Canary
        if: ${{ !inputs.job || inputs.job == matrix.job }}
        env:
          # A pull request runs at the pin; see `on.pull_request` above.
          VERSION: ${{ github.event_name == 'pull_request' && 'pin' || github.event.inputs.version }}
          REASON: ${{ github.event_name == 'pull_request' && 'pull request' || (github.event_name == 'schedule' && 'scheduled' || 'manual dispatch') }}
          ONLY: ${{ github.event.inputs.only }}
          JOB: ${{ matrix.job }}
        run: |
          python3 tools/canary.py \
            --work "$RUNNER_TEMP/canary" \
            --out canary-out \
            --job "$JOB" \
            --reason "$REASON" \
            ${VERSION:+--version "$VERSION"} \
            ${ONLY:+--only "$ONLY"}

      - name: Disk use
        if: ${{ always() && (!inputs.job || inputs.job == matrix.job) }}
        run: df -h /

      - uses: actions/upload-artifact@v4
        if: ${{ always() && (!inputs.job || inputs.job == matrix.job) }}
        with:
          name: canary-${{ matrix.job }}
          path: canary-out/
          if-no-files-found: warn
          retention-days: 30
